# Render 部署配置：单服务同时托管前端静态文件与后端 API
services:
  - type: web
    name: clue-pool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: AI_MODEL
        value: kimi-k2-0905-preview
      - key: AI_VISION_MODEL
        value: kimi-k2-0905-preview
      - key: SECRET_KEY
        generateValue: true
